<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Vibe – VibeGPT</title>
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(to bottom right, #8b5cf6, #6366f1);
      color: white;
      text-align: center;
      padding: 4rem 1rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
    }
    .vibe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      max-width: 800px;
      margin: auto;
    }
    button {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid white;
      color: white;
      padding: 1rem;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #ec4899;
    }
    .confirm {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <h1>Choose Your Vibe</h1>
  <div class="vibe-grid">
    <button onclick="selectVibe('Relax')">Relax 🛀</button>
    <button onclick="selectVibe('Explore')">Explore 🧭</button>
    <button onclick="selectVibe('Quick')">Quick ⚡</button>
    <button onclick="selectVibe('Work')">Work 💼</button>
    <button onclick="selectVibe('Older Sister')">Older Sister 👩‍🦱</button>
    <button onclick="selectVibe('Older Brother')">Older Brother 👨‍🦱</button>
    <button onclick="selectVibe('Fatherly')">Fatherly 👨‍👧</button>
  </div>
  <div class="confirm">
    <p id="selected">No vibe selected yet.</p>
    <button onclick="saveVibe()">Confirm Vibe</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      'https://cnhysmiimnnxrwoehwkb.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuaHlzbWlpbW5ueHJ3b2Vod2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYwMjc0NDAsImV4cCI6MjA2MTYwMzQ0MH0.QoiweuTtypPMKEmdHlLrftP6PgZjojnQkEl-aaJR44g'
    );

    let selectedVibe = null;

    async function selectVibe(vibe) {
      selectedVibe = vibe;
      document.getElementById('selected').textContent = `Selected Vibe: ${vibe}`;
    }

    async function saveVibe() {
      if (!selectedVibe) {
        alert('Please select a vibe first.');
        return;
      }

      const { data: { user }, error: userError } = await supabase.auth.getUser();
      if (userError || !user) {
        alert('User not logged in.');
        return;
      }

      const { error } = await supabase.from('profiles').upsert({
        id: user.id,
        vibe: selectedVibe
      });

      if (error) {
        alert('Failed to save vibe: ' + error.message);
      } else {
        alert(`✅ Vibe "${selectedVibe}" saved! Redirecting...`);
        window.location.href = '/chat.html';
      }
    }
  </script>
</body>
</html>
