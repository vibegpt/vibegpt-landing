<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – VibeGPT</title>
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(to bottom right, #8b5cf6, #6366f1);
      color: white;
      text-align: center;
      padding: 4rem 1rem;
    }
    form {
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 1rem;
      display: inline-block;
    }
    input[type="email"] {
      padding: 0.75rem;
      width: 250px;
      border-radius: 6px;
      border: none;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    button {
      background: #ec4899;
      border: none;
      color: white;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #db2777;
    }
  </style>
</head>
<body>
  <h1>Log in to VibeGPT</h1>
  <p>Enter your email to get a magic login link</p>

  <form id="login-form">
    <input type="email" id="email" placeholder="Enter your email" required /><br />
    <button type="submit">Send Magic Link</button>
  </form>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;

      const response = await fetch("https://cnhysmiimnnxrwoehwkb.supabase.co/auth/v1/magiclink", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuaHlzbWlpbW5ueHJ3b2Vod2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYwMjc0NDAsImV4cCI6MjA2MTYwMzQ0MH0.QoiweuTtypPMKEmdHlLrftP6PgZjojnQkEl-aaJR44g",
          "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuaHlzbWlpbW5ueHJ3b2Vod2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYwMjc0NDAsImV4cCI6MjA2MTYwMzQ0MH0.QoiweuTtypPMKEmdHlLrftP6PgZjojnQkEl-aaJR44g"
        },
        body: JSON.stringify({
          email: email,
          type: "magiclink",
          redirect_to: "https://vibegpt-landing.vercel.app/success.html"
        })
      });

      if (response.ok) {
        alert("✅ Magic link sent! Check your inbox.");
      } else {
        const error = await response.json();
        console.error("Error:", error);
        alert("❌ Login failed: " + error.msg);
      }
    });
  </script>
</body>
</html>
